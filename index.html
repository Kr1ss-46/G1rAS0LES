          actividades: weights.actividades / total,

            if (totalActWeight > 0) {
              const weightedSum = student.activities.reduce((sum, act) => sum + (act.grade * act.weight), 0);
              activitiesGrade = weightedSum / totalActWeight;
            } else {
              const sumGrades = student.activities.reduce((sum, act) => sum + act.grade, 0);
              activitiesGrade = sumGrades / student.activities.length;
              totalActWeight = 100;
            }
          }

          const attendanceGrade = student.attendanceRate / 10;
          const finalGrade = (student.parcialesGrade * scaledWeights.parciales) +

                             (activitiesGrade * scaledWeights.actividades);

          // Calculate profile
          const rub = student.rubric;
          const visualScore = rub.habilidadesArtisticas * 1.2 + rub.aportacionIdeas * 0.5;
          const logicScore = rub.resolucionProblemas * 1.2 + rub.retencionDatos * 1.0;
          const socialScore = rub.sociabilidad * 1.0 + rub.apoyoCompaneros * 1.0 + rub.liderazgo * 0.8;
          const emotionalScore = rub.inteligenciaEmocional * 1.2 + rub.participacion * 0.8;

          const max = Math.max(visualScore, logicScore, socialScore, emotionalScore);
          let pStyle = STYLE_REGISTRY.visual;
          if (max === logicScore) pStyle = STYLE_REGISTRY.logic;
          else if (max === socialScore) pStyle = STYLE_REGISTRY.social;
          else if (max === emotionalScore) pStyle = STYLE_REGISTRY.emotional;

          return {
            ...student,
            activitiesGrade,
            totalActWeight,
            finalGrade,
            predictedProfile: pStyle
          };
        });

}`;

          {/* Footer */}
          <footer className="w-full border-t border-dashed border-pink-200 py-8 text-center text-[11px] text-gray-500 font-semibold leading-relaxed">
            <p>🐾 Elaborado con cariño y dedicación para el sector de educación básica. 🌺</p>
            <p className="mt-0.5 text-[10px] text-gray-400">Colegio Girasoles - Agenda de Gestión Psico-Educativa en Múltiples Inteligencias.</p>
          </footer>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
